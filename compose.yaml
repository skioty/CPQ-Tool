name: cpq-prototype
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cpq_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    platform: linux/amd64
    # Keep the runtime PID outside the source mount and recover after an interrupted Docker shutdown.
    command: [sh, -c, 'rm -f /tmp/cpq-rails.pid && exec bundle exec rails server -b 0.0.0.0 -P /tmp/cpq-rails.pid']
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment: &backend_environment
      RAILS_ENV: development
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      DATABASE_HOST: db
      DATABASE_USER: ${POSTGRES_USER:-cpq}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
      DATABASE_NAME: ${POSTGRES_DB:-cpq_development}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-cpq_test}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    command: [npm, start, --, --host, 0.0.0.0, --poll, '1000', --proxy-config, proxy.conf.json]
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-4200}:4200'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/proxy.conf.json:/app/proxy.conf.json:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
  backend-test:
    platform: linux/amd64
    profiles: [test]
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      <<: *backend_environment
      RAILS_ENV: test
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'bundle exec rails db:prepare && bundle exec rails test']
volumes:
  postgres_data:

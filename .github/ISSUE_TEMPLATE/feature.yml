    id: ownership
    attributes:
      label: Ownership and scheduling
      description: Owner Member role, reviewer role, priority, target Day, dependencies
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Scope and acceptance criteria
      description: Include permissions, validation, tests and unresolved decisions. Do not assume business rules.
    validations:
      required: true

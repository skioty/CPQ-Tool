name: Bug
description: Report a reproducible defect
title: "fix: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected and actual behavior
      description: Include commit/environment and sanitized evidence; never include secrets.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Triage and regression
      description: Owner/reviewer Member role, priority, target Day, dependencies and regression acceptance criteria
    validations:
      required: true
